name: Build APP

on:
  push:
    branches: [master, old-android]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Debug and Release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t debug_apks < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | sort)
          mapfile -t release_apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort)
          if (( ${#debug_apks[@]} != 1 || ${#release_apks[@]} != 1 )); then
            echo 'Expected exactly one Debug APK and one Release APK.' >&2
            printf 'Debug APKs: %s; Release APKs: %s\n' "${#debug_apks[@]}" "${#release_apks[@]}" >&2
            exit 1
          fi
          cp "${debug_apks[0]}" dist/app-debug.apk
          cp "${release_apks[0]}" dist/app-release-unsigned.apk
          ls -lh dist/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: dist/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload raw Release build APK
        uses: actions/upload-artifact@v4
        with:
          name: release-build-apk
          path: dist/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      # PRs from forks do not receive signing secrets.
      - name: Sign Release APK
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KS_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_KEY:-}" || -z "${ALIAS:-}" || -z "${KS_PASSWORD:-}" ]]; then
            echo 'Missing signing secrets: SIGNING_KEY, ALIAS, or KEY_STORE_PASSWORD.' >&2
            exit 1
          fi
          export KEY_PASSWORD="${KEY_PASSWORD:-$KS_PASSWORD}"
          keystore="$RUNNER_TEMP/android-release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"

          "$build_tools/zipalign" -P 16 -f 4 \
            dist/app-release-unsigned.apk dist/app-release-aligned.apk
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ALIAS" \
            --ks-pass env:KS_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out dist/app-release.apk \
            dist/app-release-aligned.apk
          "$build_tools/apksigner" verify --verbose dist/app-release.apk
          rm -f dist/app-release-aligned.apk
          (cd dist && sha256sum app-release.apk > app-release.apk.sha256)

      - name: Upload signed Release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            dist/app-release.apk
            dist/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed Release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: dist

      - name: Publish Release with APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/app-release.apk dist/app-release.apk.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/app-release.apk dist/app-release.apk.sha256 \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
